<!DOCTYPE html>
<html>
<head>
  <script src="https://www.google.com/recaptcha/api.js?render=TA_SITE_KEY_ICI"></script>
  <script>
    function onExecute(action) {
      grecaptcha.ready(function() {
        grecaptcha.execute('TA_SITE_KEY_ICI', {action: action}).then(function(token) {
          if (window.RecaptchaFlutterChannel) {
            window.RecaptchaFlutterChannel.postMessage(token);
          }
        });
      });
    }
  </script>
</head>
<body></body>
</html>
